# Embedded via `include_str!` in `src/indexers/manifest.rs`: pinned
# versions and (for direct binary downloads) sha256 checksums for the SCIP
# indexers tamga knows how to acquire into its managed `tools/` cache.
#
# Provenance, verified 2026-09-09 (see task-5-report.md for the full
# research trail):
#
# - scip-go: sourcegraph/scip-go release v0.2.7. Checksums are the sha256
#   GitHub itself reports for each asset (Releases API `digest` field);
#   independently re-verified by downloading each asset and hashing it
#   locally (`shasum -a 256`). Note: the sourcegraph/scip-go repository has
#   since been transferred to the `scip-code` org; GitHub 301/302-redirects
#   the old `sourcegraph/scip-go` release download URLs to
#   `scip-code/scip-go`, confirmed working end-to-end, so `repo` below is
#   left as `sourcegraph/scip-go`. Only 3 targets ship prebuilt binaries
#   (no x86_64-apple-darwin, no Windows) -- unlisted targets are a resolve-
#   time "no prebuilt binary for this platform" error, not a manifest
#   error.
# - scip-typescript / scip-python: published to npm under the @sourcegraph
#   scope. Versions are each package's current "latest" dist-tag per the
#   npm registry API. npm's own package-integrity check (documented in
#   acquire.rs) is the trust boundary for these -- no separate sha256 is
#   tracked here.

[scip-go]
version = "0.2.7"
dist = "github-release"
repo = "sourcegraph/scip-go"

[scip-go.targets.aarch64-apple-darwin]
asset = "scip-go-darwin-arm64.tar.gz"
sha256 = "f21b505452a8dbb270c18ec66690e583801f9e96cff1d72e84c004b7374ec672"

[scip-go.targets.x86_64-unknown-linux-gnu]
asset = "scip-go-linux-amd64.tar.gz"
sha256 = "5bfe39016ca04f5b3b1cce41d1b63ea120a7d7e93b55407bfb17a6b02d18135a"

[scip-go.targets.aarch64-unknown-linux-gnu]
asset = "scip-go-linux-arm64.tar.gz"
sha256 = "6b93476c7578c5aeb5acacb41f8234c20130168271adea0db8d8ae63d1355acb"

[scip-typescript]
version = "0.4.0"
dist = "npm"
package = "@sourcegraph/scip-typescript"

[scip-python]
version = "0.6.6"
dist = "npm"
package = "@sourcegraph/scip-python"

# M5 additions, verified 2026-09-09 (see task-6-report.md for the full
# research trail):
#
# - rust-analyzer: rust-lang/rust-analyzer publishes date-stamped release
#   tags (e.g. `2026-09-07`), not `v<version>` -- hence the explicit `tag`
#   below (see DistKind::GithubRelease's `tag` field). Release assets are a
#   bare gzip-compressed binary per target (`.gz`, not `.tar.gz`), verified
#   by independently downloading and re-hashing each asset locally in
#   addition to cross-checking GitHub's own reported asset digest. Every
#   listed target was also live-tested end to end (gunzip, chmod, `scip
#   <dir> --output <file>` against a real Cargo fixture).
# - scip-ruby: the real project is `sourcegraph/scip-ruby` -- the brief's
#   guess of `sorbet/scip-ruby` does not exist (404). Release tags are
#   `scip-ruby-v<version>`, not `v<version>`, hence the explicit `tag`.
#   Only two targets ship a prebuilt binary at all (bare executable, no
#   archive): macOS arm64 and Linux x86_64. There is no
#   aarch64-unknown-linux-gnu asset (the gap sits on Linux arm64 here,
#   unlike scip-go's Intel-mac gap) -- that target resolves to the existing
#   "no prebuilt binary for this platform" error. The macOS arm64 binary
#   was downloaded, checksum-verified locally, and live-tested
#   (`--index-file <file> --gem-metadata <name>@<version> <dir>`) against a
#   tiny Ruby fixture with a gemspec.
# - scip-php: the brief's guessed package name `davidrjenni/scip-php` is
#   correct (verified on Packagist and GitHub). It has no tagged binary
#   releases at all -- it's a composer dev-dependency, installed via
#   `composer require`, landing at `vendor/bin/scip-php` (see the new
#   `dist = "composer"` kind). No separate checksum is tracked, same
#   rationale as the npm-dist entries: composer's own package-integrity
#   check is the trust boundary.

[rust-analyzer]
version = "2026-09-07"
dist = "github-release"
repo = "rust-lang/rust-analyzer"
tag = "2026-09-07"

[rust-analyzer.targets.aarch64-apple-darwin]
asset = "rust-analyzer-aarch64-apple-darwin.gz"
sha256 = "16e9b2af9db7c0ce015ffe88f85db27669b05c84887a59c737d697d2c5f8d349"

[rust-analyzer.targets.x86_64-unknown-linux-gnu]
asset = "rust-analyzer-x86_64-unknown-linux-gnu.gz"
sha256 = "a3500183aa08bf740c0da6e030ad262d4cfa1c19e7ce195ab5f772bdf9ddfb12"

[rust-analyzer.targets.aarch64-unknown-linux-gnu]
asset = "rust-analyzer-aarch64-unknown-linux-gnu.gz"
sha256 = "484de96ea9e5daf9e6361b6fa91be9521a7e6c652111af54a7ead80f900b1e55"

[scip-ruby]
version = "0.4.8"
dist = "github-release"
repo = "sourcegraph/scip-ruby"
tag = "scip-ruby-v0.4.8"

[scip-ruby.targets.aarch64-apple-darwin]
asset = "scip-ruby-arm64-darwin"
sha256 = "21eae26b54402b04214ba5e6f6014c9f6b0fa394352825f33eb6314666dabd79"

[scip-ruby.targets.x86_64-unknown-linux-gnu]
asset = "scip-ruby-x86_64-linux"
sha256 = "125982c27b59f8f35e6eb2904718789a4bdf28b0637baad9532977769b6058a7"

[scip-php]
version = "0.0.2"
dist = "composer"
package = "davidrjenni/scip-php"

# M6 additions, verified 2026-09-09 (see task-7-report.md for the full
# research trail):
#
# - scip-java: distributed via coursier only (no standalone release
#   binaries; Docker + coursier launcher/bootstrap are the sole channels).
#   The project was reorganized under the `scip-code` org: the Maven group
#   moved from `com.sourcegraph` to `org.scip-code` and the CLI was
#   rewritten in Kotlin (so the artifact is `scip-java`, no Scala `_2.13`
#   suffix). Installed via the coursier `contrib` channel app name
#   `scip-java` (`cs install --contrib --install-dir <dir> scip-java:<ver>`)
#   -- see DistKind::Coursier. No separate sha256: coursier's own
#   Maven-artifact integrity is the trust boundary, same as the npm/composer
#   entries. Latest stable release is v0.13.1. Requires JDK 17+ to run.
# - scip-dotnet: a .NET global/local tool published to NuGet under the id
#   `scip-dotnet` (verified on nuget.org + the sourcegraph/scip-dotnet
#   repo). Installed via `dotnet tool install scip-dotnet --tool-path <dir>
#   --version <ver>` -- see DistKind::DotnetTool. NuGet's own package
#   integrity is the trust boundary. Its `index` command takes a positional
#   `.sln`/`.slnx`/`.csproj`/`.vbproj` target plus `--output <path>`
#   (confirmed from ScipDotnet/Program.cs), matching the index-step argv.
#   Latest version is 0.2.14.

[scip-java]
version = "0.13.1"
dist = "coursier"
app = "scip-java"

[scip-dotnet]
version = "0.2.14"
dist = "dotnet-tool"
package = "scip-dotnet"

# M7 addition, verified 2026-09-09 (see task-8-report.md for the full
# research trail):
#
# - scip-clang: sourcegraph/scip-clang release v0.4.0 (2026-02-23). Ships
#   exactly 3 assets: a macOS arm64 binary, a Linux x86_64 binary, and a
#   "-dev" (debug/symbols) Linux x86_64 build we don't use. Checksums are
#   the sha256 GitHub itself reports for each asset (Releases API `digest`
#   field); independently re-verified by downloading both assets used here
#   and hashing them locally (`shasum -a 256`), and the macOS arm64 binary
#   was additionally live-tested end to end (`--compdb-path
#   compile_commands.json --index-output-path index.scip`) against a tiny
#   hand-written 2-file compdb with a cross-file call. Unlike the brief's
#   guess ("possibly no macOS arm64 binary"), a macOS arm64 binary DOES
#   ship -- the real upstream gap is aarch64-unknown-linux-gnu (Linux
#   arm64), which has no published asset at all and resolves to the
#   existing "no prebuilt binary for this platform" error.

[scip-clang]
version = "0.4.0"
dist = "github-release"
repo = "sourcegraph/scip-clang"

[scip-clang.targets.aarch64-apple-darwin]
asset = "scip-clang-arm64-darwin"
sha256 = "ff042fbc8a029f09f4b69fc7692e290e21c52923593207ee52d4e7439473ec64"

[scip-clang.targets.x86_64-unknown-linux-gnu]
