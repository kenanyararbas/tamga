[package]
name = "tamga"
version = "0.1.1"
edition = "2024"
authors = ["tamga contributors"]
description = "A standalone SCIP orchestrator: detect language/build families, prepare, run the right indexer, and merge into one repo-relative SCIP index."
license = "MIT"
repository = "https://github.com/kenanyararbas/tamga"

[dependencies]
anyhow = "1.0.104"
# Only `Utc::now()` + `.format()`/`.to_rfc3339()` are used (workspace.rs,
# pipeline.rs) -- no chrono types are ever serialized, so `serde` isn't
# needed. `clock` pulls in `now` -> `std` -> `alloc` transitively, which is
# everything the above actually requires; `default-features = false` drops
# `oldtime` (unused legacy Duration compat) and `wasmbind` (this is a
# native CLI, never WASM).
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
command-group = "5.0.1"
# `termination`: without it, `ctrlc::set_handler` only installs a SIGINT
# handler; with it, the same handler is also installed for SIGTERM (and
# SIGHUP) on unix, so `CancelToken::install_ctrlc_handler`'s one call
# covers a `kill`/systemd-style SIGTERM the same way it already covers
# Ctrl-C, closing the gap M6's review noted (SIGTERM left global.json
# relaxed with no restore hook).
ctrlc = { version = "3.5.2", features = ["termination"] }
flate2 = "1.1.10"
globset = "0.4.16"
hex = "0.4.3"
ignore = "0.4.23"
protobuf = "3.7.2"
scip = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.20"
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ureq = "3.4.1"
wait-timeout = "0.2.1"
zip = "8.6.0"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.43.2"
predicates = "3.1.4"
serde_json = "1.0.151"
tempfile = "3.27.0"
