[package]
name = "tamga"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
command-group = "5.0.1"
ctrlc = "3.5.2"
flate2 = "1.1.10"
globset = "0.4.16"
hex = "0.4.3"
ignore = "0.4.23"
protobuf = "3.7.2"
scip = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.20"
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.1"
wait-timeout = "0.2.1"
zip = "8.6.0"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.43.2"
predicates = "3.1.4"
serde_json = "1.0.151"
tempfile = "3.27.0"
